name: Build FitRocket APK & Signed Release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fitrocket-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Verify, test and build APK
    runs-on: ubuntu-latest
    outputs:
      signed: ${{ steps.signing.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Validate food and recipe catalog
        run: python3 scripts/validate_catalog.py

      - name: Validate AI response schema
        run: python3 scripts/validate_ai_schema.py

      - name: Android unit tests and build debug APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace

      - name: Upload debug-only test APK
        uses: actions/upload-artifact@v4
        with:
          name: FitRocket-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Check release signing configuration
        id: signing
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          STORE_B64: ${{ secrets.FITROCKET_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.FITROCKET_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FITROCKET_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.FITROCKET_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          count=0
          for value in "$STORE_B64" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD"; do
            if [[ -n "$value" ]]; then count=$((count + 1)); fi
          done
          if [[ "$count" -eq 0 ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Release signing is not configured. Stable release publishing skipped."
          elif [[ "$count" -eq 4 ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Incomplete release signing: configure all four FITROCKET_* secrets."
            exit 1
          fi

      - name: Restore private signing keystore
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        env:
          FITROCKET_KEYSTORE_B64: ${{ secrets.FITROCKET_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$FITROCKET_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/fitrocket-release.jks"
          test -s "$RUNNER_TEMP/fitrocket-release.jks"
          echo "FITROCKET_KEYSTORE_PATH=$RUNNER_TEMP/fitrocket-release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        if: steps.signing.outputs.enabled == 'true'
        env:
          FITROCKET_STORE_PASSWORD: ${{ secrets.FITROCKET_STORE_PASSWORD }}
          FITROCKET_KEY_ALIAS: ${{ secrets.FITROCKET_KEY_ALIAS }}
          FITROCKET_KEY_PASSWORD: ${{ secrets.FITROCKET_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleRelease --no-daemon --stacktrace
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK" > /dev/null
          echo "Signed APK passed apksigner verification."

      - name: Upload signed release APK
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: FitRocket-signed-${{ github.sha }}
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary private signing key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/fitrocket-release.jks"

  publish:
    name: Publish signed GitHub Release only
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.build.outputs.signed == 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: FitRocket-signed-${{ github.sha }}
          path: apk
      - name: Publish signed FitRocket.apk
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(sed -nE 's/.*versionName = "([0-9]+\.[0-9]+\.[0-9]+)".*/\1/p' app/build.gradle.kts | head -n1)
          test -n "$VERSION"
          TAG="v$VERSION"
          test -s apk/app-release.apk
          cp apk/app-release.apk /tmp/FitRocket.apk
          # Never silently replace an APK already installed by your family.
          # Reuse a version only when manually resolving a failed release,
          # never overwrite the signing identity for an existing tag.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists. Increment versionCode and versionName before publishing."
            exit 1
          fi
          NOTES="docs/releases/$TAG.md"
          if [[ ! -s "$NOTES" ]]; then
            echo "::error::Release notes missing for $TAG: $NOTES"
            exit 1
          fi
          FIRST_LINE=$(head -n 1 "$NOTES")
          if [[ "$FIRST_LINE" != "# FitRocket $TAG"* ]]; then
            echo "::error::Release note heading does not match $TAG"
            exit 1
          fi
          gh release create "$TAG" /tmp/FitRocket.apk --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "FitRocket $TAG" \
            --notes-file "$NOTES" --latest
          echo "Signed release: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
