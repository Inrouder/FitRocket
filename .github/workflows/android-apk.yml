name: Build FitRocket APK & Release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fitrocket-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate, test, build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Validate food and recipe catalog
        run: python3 scripts/validate_catalog.py

      - name: Validate AI response schema
        run: python3 scripts/validate_ai_schema.py

      - name: Android unit tests and build
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace

      - name: Save APK as Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: FitRocket-v0.12.0-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish or refresh stable GitHub Release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(sed -nE 's/.*versionName = "([0-9]+\.[0-9]+\.[0-9]+)".*/\1/p' app/build.gradle.kts | head -n1)
          test -n "$VERSION"
          TAG="v$VERSION"
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/FitRocket.apk
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" /tmp/FitRocket.apk --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --title "FitRocket $TAG" --notes-file docs/RELEASE_NOTES.md --latest --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" /tmp/FitRocket.apk --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "FitRocket $TAG" \
              --notes-file docs/RELEASE_NOTES.md --latest
          fi
          echo "Published: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
